    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;

        .logo-area i {

            color: var(--primary-color);
        }
        .logo-area span {

        .toolbar button.btn-danger:hover {

            box-shadow: none !important;
        }
        .file-table-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid var(--glass-border);

        }
        .file-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #374151;
        }

        .upload-area {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px dashed var(--glass-border);
            border-radius: 16px;

            margin-bottom: 24px;

        .upload-area.dragover {

            transform: scale(1.01);
        }
        .upload-area input {
            display: none;
        }
        .upload-btn {
            padding: 12px 24px;
            background: var(--gradient-1);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            margin-top: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(12px);

        .modal.active {

        .modal-content {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(24px);

        .settings-modal-content {
            width: 500px;
            height: 520px;

        }
        .settings-modal-content .modal-actions {

        .toast {

            right: 24px;

            font-size: 14px;

        }

            border-radius: 12px;

        .remember-me {

        .remember-me input[type="checkbox"] {

            background: transparent;

            gap: 10px;

        .user-avatar {

        .file-table th .sort-icon {
            margin-left: 6px;
            opacity: 0.3;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .file-table th .sort-icon:hover {
            opacity: 0.7;
        }
        .file-table th .sort-icon.active {
            opacity: 1;
        }
        .file-table th .sort-icon.asc::after {
            content: '\f0de';
            font-family: 'Font Awesome 5 Free';
            font-weight: 900;
        }
        .file-table th .sort-icon.desc::after {
            content: '\f0dd';
            font-family: 'Font Awesome 5 Free';
            font-weight: 900;
        }
        .file-table th.sortable {
            cursor: pointer;
            user-select: none;
        }
        .file-table th.sortable:hover {
            background: #f3f4f6;
        }
        .breadcrumb {
            font-size: 14px;
            margin-bottom: 16px;
            color: var(--text-secondary);
        }
        .breadcrumb a {
            color: var(--primary-color);
            text-decoration: none;
        }
        .breadcrumb a:hover {
            text-decoration: underline;
        }
        .breadcrumb span {
            margin: 0 8px;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--gradient-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        .loading-spinner {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, var(--primary-color));
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 8px), #fff 0);
            mask: radial-gradient(farthest-side, transparent calc(100% - 8px), #fff 0);
            animation: spin 1.5s linear infinite;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .loading-ring {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 3px solid transparent;
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 2s linear infinite;
            opacity: 0.5;
        }
        .loading-ring:nth-child(2) {
            animation-direction: reverse;
            animation-duration: 2.5s;
            border-top-color: #818cf8;
        }
        .loading-text {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .loading-dots {
            display: flex;
            gap: 4px;
        }
        .loading-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary-color);
            animation: dotPulse 1.4s ease-in-out infinite both;
        }
        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }
        .loading-dot:nth-child(3) { animation-delay: 0s; }
        @keyframes dotPulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
        .loading-content {
            position: relative;
        }
    </style>
</head>
<body>
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="loading-container">
            <div class="loading-content">
                <div class="loading-ring"></div>
                <div class="loading-ring"></div>
                <div class="loading-spinner"></div>
            </div>
            <div class="loading-text">
                <span></span>
                <span class="loading-dots">
                    <span class="loading-dot"></span>
                    <span class="loading-dot"></span>
                    <span class="loading-dot"></span>
                </span>
            </div>
        </div>
    </div>
    <div id="loginScreen" class="login-screen" style="display: none;">
        <div class="login-box">
            <h2 id="loginTitle">文件管理器</h2>
            <button class="close-btn" style="background: #f3f4f6; border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 16px; cursor: pointer; color: #6b7280; display: flex; align-items: center; justify-content: center; transition: all 0.2s;" onclick="closeLoginScreen()"><i class="fas fa-times"></i></button>
            <input type="text" id="loginUsername" placeholder="请输入用户名">
            <input type="password" id="loginPassword" placeholder="请输入密码">
            <label class="remember-me">
                <input type="checkbox" id="rememberMe">
                <span>记住密码</span>
            </label>
            <button onclick="login()">登 录</button>
        </div>
    </div>
    <div id="mainApp">
        <div class="content">
            <div class="top-bar">
                <div class="logo-area">
                    <img id="siteLogo" src="" alt="" style="display: none; width: 32px; height: 32px; border-radius: 8px;">
                    <i id="siteIcon" class="fas fa-folder-open"></i>
                    <span id="siteName">加载中...</span>
                </div>
                <div class="top-actions" id="topActions">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="请输入关键词！" onkeydown="handleSearchKey(event)">
                        <button class="search-btn" title="搜索" onclick="toggleSearch()"><i class="fas fa-search"></i></button>
                    </div>
                </div>
            </div>
            <div class="main-area">
                <div class="toolbar" id="mainToolbar"></div>
                <div class="main-area-content">
                    <div class="breadcrumb" id="breadcrumb"></div>
                    <div class="file-table-container" id="fileList" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
                        <div class="upload-area" id="uploadArea">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>拖拽文件或文件夹到此处上传</p>
                        </div>
                        <table class="file-table file-table-header">
                            <thead>
                                <tr>
                                    <th><input type="checkbox" id="selectAll" onclick="toggleSelectAll()"></th>
                                    <th class="sortable" onclick="sortBy('name')">名称<span id="sort-name" class="sort-icon"></span></th>
                                    <th class="sortable" style="text-align:right" onclick="sortBy('size')">大小<span id="sort-size" class="sort-icon"></span></th>
                                    <th class="sortable" style="text-align:right" onclick="sortBy('modified')">修改时间<span id="sort-modified" class="sort-icon"></span></th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                        </table>
                        <div class="file-table-wrapper">
                            <table class="file-table file-table-body">
                                <tbody id="fileTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="copyright-footer" id="copyrightFooter"></div>
        </div>
    </div>
    <div class="modal" id="mkdirModal">
        <div class="modal-content">
            <h3>新建文件夹</h3>
            <input type="text" id="dirnameInput" placeholder="文件夹名称">
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeModal('mkdirModal')">取消</button>
                <button class="btn-primary" onclick="createDir()">创建</button>
            </div>
        </div>
    </div>
    <div class="modal" id="renameModal">
        <div class="modal-content">
            <h3>重命名</h3>
            <input type="text" id="renameInput" placeholder="新名称">
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeModal('renameModal')">取消</button>
                <button class="btn-primary" onclick="doRename()">确定</button>
            </div>
        </div>
    </div>
    <div class="modal" id="historyModal">
        <div class="modal-content" style="width: 620px; max-height: 70vh; display: flex; flex-direction: column;">
            <h3>操作历史</h3>
            <div id="historyContent" style="flex: 1; overflow-y: auto; margin-bottom: 20px;"></div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeModal('historyModal')">关闭</button>
                <button class="btn-danger" onclick="clearHistory()">清空历史</button>
            </div>
        </div>
    </div>
    <div class="modal" id="shareModal">

                <button class="btn-secondary" onclick="closeModal('shareModal')">关闭</button>
                <button class="btn-danger" onclick="deleteSelectedShares()">删除选中</button>
            </div>
        </div>

            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeModal('cleanupHiddenModal')">取消</button>
                <button class="btn-danger" onclick="confirmCleanupHidden()">清理</button>
            </div>
        </div>

    <div class="modal" id="settingsModal">

                <button class="tab active" onclick="switchTab('tab1')">站点设置</button>
                <button class="tab" onclick="switchTab('tab2')">端口设置</button>

            </div>
            
            <div id="tab1" class="tab-content active">

                        <label>站点名称：</label>
                        <input type="text" id="settingNetworkName" value="文件管理">

                        <label>站点Logo：</label>
                        <input type="text" id="settingNetworkLogo" value="" placeholder="如：./img/logo.png">
                    </div>
                    <div class="settings-row">
                        <label>版权年份：</label>
                        <input type="text" id="settingCopyrightYear" value="" placeholder="如：2026">
                    </div>
                    <div class="settings-row">
                        <label>版权域名：</label>
                        <input type="text" id="settingCopyrightDomain" value="" placeholder="如：FFing.cn">
                    </div>
                </div>
            </div>
            
            <div id="tab2" class="tab-content">
                <div class="settings-section">
                    <div class="settings-row">
                        <label>HTTP端口：</label>
                        <input type="number" id="settingPort" value="">
                        <label style="width:auto;margin-left:12px;display:flex;align-items:center;gap:6px;">
                            <input type="checkbox" id="settingEnableHttp" checked disabled style="width:18px;height:18px;accent-color:var(--primary-color);cursor:not-allowed;">
                            启用
                        </label>
                    </div>
                    <div class="settings-row">
                        <label>HTTPS端口：</label>
                        <input type="number" id="settingHttpsPort" value="" placeholder="默认端口：8443">
                        <label style="width:auto;margin-left:12px;display:flex;align-items:center;gap:6px;">
                            <input type="checkbox" id="settingEnableHttps" style="width:18px;height:18px;accent-color:var(--primary-color);cursor:pointer;">
                            启用
                        </label>
                    </div>

            <div id="tab5" class="tab-content">

                    <div class="settings-row">

                        <label style="width:auto;margin-left:12px;display:flex;align-items:center;gap:6px;">

                    <br>
                    <div class="settings-row">

                        <input type="number" id="settingFtpPort" value="" placeholder="默认端口：21">

                            <input type="checkbox" id="settingEnableFtp" style="width:18px;height:18px;accent-color:var(--primary-color);cursor:pointer;">

                        <input type="number" id="settingFtpPassiveMin" value="" placeholder="50000" style="flex:1;min-width:100px;">
                        <span style="margin:0 8px;color:var(--text-secondary);">-</span>

    <div class="modal" id="deleteConfirmModal">
        <div class="modal-content">
            <h3>确认删除</h3>
            <p id="deleteConfirmText" style="margin-bottom: 20px;">确定要删除吗？</p>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeModal('deleteConfirmModal')">取消</button>
                <button class="btn-danger" onclick="confirmDelete()">删除</button>
            </div>
        </div>
    </div>
    <div id="toast" class="toast"></div>
    <div id="uploadProgress" class="upload-progress">
        <div class="upload-progress-header">
            <span class="upload-progress-title"><i class="fas fa-upload"></i> 上传进度</span>
            <span class="upload-progress-close" onclick="hideUploadProgress()">✕</span>
        </div>
        <div id="uploadProgressContent"></div>
    </div>
    <input type="file" id="fileInput" style="display:none" multiple onchange="handleFileSelect(event)">

    <script>
        let currentPath = '';
        let auth = { username: '', password: '' };
        let selectedItems = new Set();
        let renameTarget = '';
        let uploadsInProgress = {};
        let uploadCompleteCount = 0;
        let totalUploads = 0;
        let uploadIdCounter = 0;
        let hideTimeout = null;
        let isLoggedIn = false;
        let allFiles = [];
        let actionHistory = JSON.parse(localStorage.getItem('actionHistory') || '[]');
        let shareLinks = JSON.parse(localStorage.getItem('shareLinks') || '[]');
        let pendingDeleteItems = [];

        async function syncSharesFromBackend() {
            try {
                const response = await api('/api/shares');
                if (response && response.ok) {
                    const backendShares = await response.json();
                    if (backendShares && backendShares.length > 0) {
                        shareLinks = backendShares.map(s => ({
                            token: s.token,
                            path: s.path,
                            createdAt: new Date(s.created_at).toLocaleString(),
                            is_dir: s.is_dir || false
                        }));
                        localStorage.setItem('shareLinks', JSON.stringify(shareLinks));
                    }
                }
            } catch (e) {
                console.error('Failed to sync shares from backend', e);
            }
        }
        let isSearchMode = false;
        let sortField = 'name';
        let sortDirection = 'asc';
        const STORAGE_KEY = 'fileManagerAuth';
        const REMEMBER_KEY = 'fileManagerRemember';
        const LAST_ACTIVE_KEY = 'fileManagerLastActive';
        const SERVER_START_KEY = 'fileManagerServerStart';
        const SESSION_TIMEOUT = 60000;

        function getLastActive() {
            const lastActive = localStorage.getItem(LAST_ACTIVE_KEY);
            return lastActive ? parseInt(lastActive) : 0;
        }

        function setLastActive() {
            localStorage.setItem(LAST_ACTIVE_KEY, Date.now().toString());
        }

        function isSessionValid() {
            const lastActive = getLastActive();
            return Date.now() - lastActive < SESSION_TIMEOUT;
        }

        function saveAuthToStorage(remember = false) {
            const storage = remember ? localStorage : sessionStorage;
            storage.setItem(STORAGE_KEY, JSON.stringify({
                username: auth.username,
                password: auth.password,
                remember: remember
            }));
            if (remember) {
                localStorage.setItem(REMEMBER_KEY, 'true');
                setLastActive();
            } else {
                localStorage.removeItem(REMEMBER_KEY);
                localStorage.removeItem(STORAGE_KEY);
            }
        }

        function loadAuthFromStorage() {
            let saved = sessionStorage.getItem(STORAGE_KEY);
            let fromLocalStorage = false;
            if (!saved) {
                saved = localStorage.getItem(STORAGE_KEY);
                fromLocalStorage = true;
            }
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    if (data.remember) {
                        document.getElementById('loginUsername').value = data.username || '';
                        document.getElementById('loginPassword').value = data.password || '';
                    } else {
                        document.getElementById('loginUsername').value = '';
                        document.getElementById('loginPassword').value = '';
                        auth.username = '';
                        auth.password = '';
                    }
                    document.getElementById('rememberMe').checked = data.remember;
                    // 更新 auth 对象，确保上传等操作能使用正确的凭证
                    if (data.username && data.password) {
                        auth.username = data.username;
                        auth.password = data.password;
                    }
                    if (!fromLocalStorage) {
                        isLoggedIn = true;
                        setLastActive();
                        return true;
                    }
                    if (data.remember && isSessionValid()) {
                        isLoggedIn = true;
                        setLastActive();
                        return true;
                    }
                    return false;
                } catch (e) {
                    sessionStorage.removeItem(STORAGE_KEY);
                    localStorage.removeItem(STORAGE_KEY);
                }
            }
            return false;
        }

        function clearAuthStorage() {
            sessionStorage.removeItem(STORAGE_KEY);
            localStorage.removeItem(STORAGE_KEY);
            localStorage.removeItem(REMEMBER_KEY);
            localStorage.removeItem(LAST_ACTIVE_KEY);
        }

        window.addEventListener('beforeunload', function() {
            if (isLoggedIn) {
                setLastActive();
            }
        });

        async function api(path, options = {}) {
            const fetchOptions = { ...options };
            if (isLoggedIn) {
                fetchOptions.headers = {
                    ...fetchOptions.headers,
                    'Authorization': 'Basic ' + btoa(auth.username + ':' + auth.password)
                };
            }
            const response = await fetch(path, fetchOptions);
            if (response.status === 401 && isLoggedIn) {
                logout();
                return null;
            }
            return response;
        }
        function login() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const remember = document.getElementById('rememberMe').checked;
            if (!username || !password) {
                showToast('请输入用户名和密码', 'error');
                return;
            }
            fetch('/api/login', {
                headers: {
                    'Authorization': 'Basic ' + btoa(username + ':' + password)
                }
            }).then(response => {
                if (response.ok) {
                    auth.username = username;
                    auth.password = password;
                    isLoggedIn = true;
                    saveAuthToStorage(remember);
                    document.getElementById('loginScreen').style.display = 'none';
                    document.removeEventListener('keydown', handleLoginKeydown);
                    updateTopActions();
                    updateToolbar();
                    loadFiles('');
                    syncSharesFromBackend();
                    showToast('登录成功', 'success');
                } else {
                    response.json().then(data => {
                        const errorMsg = data && data.message ? data.message : '用户名或密码错误';
                        const isLockout = data && data.error === 'too_many_attempts';
                        showToast(errorMsg, 'error', isLockout ? 5000 : 3000);
                    }).catch(() => {
                        showToast('用户名或密码错误', 'error');
                    });
                }
            }).catch(() => {
                showToast('用户名或密码错误', 'error');
            });
        }
        function logout() {
            isLoggedIn = false;
            sessionStorage.removeItem(STORAGE_KEY);
            localStorage.removeItem(STORAGE_KEY);
            auth = { username: '', password: '' };
            selectedItems.clear();
            currentPath = '';
            updateTopActions();
            updateToolbar();
            loadFiles('');
            showToast('已退出登录');
        }
        function updateTopActions() {
            const topActions = document.getElementById('topActions');
            const searchBox = `
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="" onkeyup="handleSearchKey(event)">
                    <button class="search-btn" title="搜索" onclick="toggleSearch()"><i class="fas fa-search"></i></button>
                </div>
            `;
            if (!isLoggedIn) {
                topActions.innerHTML = searchBox + `
                    <button class="top-action-btn" title="登录" onclick="openLoginScreen()"><i class="fas fa-user"></i></button>
                `;
            } else {
                topActions.innerHTML = searchBox + `
                    <button class="top-action-btn" title="上传进度" onclick="toggleUploadProgress()"><i class="fas fa-exchange-alt" id="uploadToggleIcon" style="transform: rotate(90deg);"></i></button>
                    <button class="top-action-btn" title="分享列表" onclick="showShares()"><i class="fas fa-link"></i></button>
                    <button class="top-action-btn" title="操作历史" onclick="showHistory()"><i class="fas fa-history"></i></button>
                    <button class="top-action-btn" title="设置" onclick="showSettings()"><i class="fas fa-cog"></i></button>
                    <button class="top-action-btn" title="退出" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
                `;
            }
        }
        function updateToolbar() {
            const toolbar = document.querySelector('.toolbar');
            if (!isLoggedIn) {
                toolbar.innerHTML = ``;
                toolbar.style.border = 'none';
                toolbar.style.background = 'transparent';
            } else {
                toolbar.innerHTML = `                   
                    <button class="toolbar-btn" title="上传文件" onclick="showFileUpload()"><i class="fas fa-file-upload"></i></button>
                    <button class="toolbar-btn" title="新建目录" onclick="showMkdirModal()"><i class="fas fa-folder-plus"></i></button>
                    <button class="toolbar-btn" title="删除选项" onclick="deleteSelected()"><i class="fas fa-trash"></i></button>
                    <button class="toolbar-btn" title="加锁目录" onclick="lockSelectedDirectory()"><i class="fas fa-lock"></i></button>
                    <button class="toolbar-btn" title="清理隐藏文件" onclick="cleanupHiddenFiles()"><i class="fas fa-broom"></i></button>
                    <button class="toolbar-btn" title="刷新" onclick="handleRefresh()"><i class="fas fa-sync-alt"></i></button>
                `;
                toolbar.style.border = '';
                toolbar.style.background = '';
            }
        }
        const startTime = Date.now();
        let pageLoaded = false;

        function hideLoadingOverlay() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            if (loadingOverlay) {
                loadingOverlay.classList.add('hidden');
            }
        }

        function showLoadingOverlay() {
            if (pageLoaded) return;
            const loadingOverlay = document.getElementById('loadingOverlay');
            if (loadingOverlay) {
                loadingOverlay.classList.remove('hidden');
            }
        }

        function onPageLoaded() {
            pageLoaded = true;
            hideLoadingOverlay();
        }

        const threshold = 1000;
        setTimeout(() => {
            const elapsed = Date.now() - startTime;
            if (!pageLoaded && elapsed >= threshold) {
                showLoadingOverlay();
            }
        }, threshold);

        window.addEventListener('load', onPageLoaded);

        document.addEventListener('DOMContentLoaded', async () => {
            const serverRestarted = await loadPublicConfig();
            if (serverRestarted) {
                clearAuthStorage();
            }
            const wasLoggedIn = loadAuthFromStorage();
            updateTopActions();
            updateToolbar();
            loadFiles('');
            if (wasLoggedIn) {
                syncSharesFromBackend();
            }
            scheduleHideLoading();
        });

        function closeLoginScreen() {
            document.getElementById('loginScreen').style.display = 'none';
            document.removeEventListener('keydown', handleLoginKeydown);
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
            document.getElementById('rememberMe').checked = false;
            sessionStorage.removeItem(STORAGE_KEY);
        }

        function handleLoginKeydown(event) {
            if (event.key === 'Enter') {
                const loginScreen = document.getElementById('loginScreen');
                if (loginScreen.style.display === 'flex') {
                    login();
                }
            }
        }

        function openLoginScreen() {
            loadAuthFromStorage();
            document.getElementById('loginScreen').style.display = 'flex';
            document.addEventListener('keydown', handleLoginKeydown);
        }

        async function loadPublicConfig() {
            try {
                const response = await fetch('/api/public-config');
                if (response.ok) {
                    const data = await response.json();
                    const storedServerStart = sessionStorage.getItem(SERVER_START_KEY);
                    const serverRestarted = storedServerStart && storedServerStart !== String(data.server_start_time);
                    if (serverRestarted) {
                        sessionStorage.removeItem(STORAGE_KEY);
                        localStorage.removeItem(STORAGE_KEY);
                        localStorage.removeItem(REMEMBER_KEY);
                        localStorage.removeItem(LAST_ACTIVE_KEY);
                    }
                    sessionStorage.setItem(SERVER_START_KEY, String(data.server_start_time));
                    document.title = data.network_name || '文件管理器';
                    const siteName = document.getElementById('siteName');
                    if (siteName) {
                        siteName.textContent = data.network_name || '文件管理';
                    }
                    const loginTitle = document.getElementById('loginTitle');
                    if (loginTitle) {
                        loginTitle.textContent = data.network_name || '文件管理器';
                    }
                    const copyrightFooter = document.getElementById('copyrightFooter');
                    if (copyrightFooter && data.copyright_year && data.copyright_domain) {
                        copyrightFooter.textContent = '© ' + data.copyright_year + ' ' + data.copyright_domain + '. All rights reserved.';
                    } else if (copyrightFooter) {
                        copyrightFooter.textContent = '';
                    }
                    const siteLogo = document.getElementById('siteLogo');
                    const siteIcon = document.getElementById('siteIcon');
                    const favicon = document.getElementById('favicon');
                    if (data.network_logo) {
                        const logoUrl = data.network_logo.startsWith('/') ? data.network_logo : '/' + data.network_logo.replace('./', '');
                        siteLogo.src = logoUrl;
                        siteLogo.style.display = 'block';
                        siteIcon.style.display = 'none';
                        favicon.href = logoUrl;
                        favicon.type = 'image/png';
                    } else {
                        siteLogo.style.display = 'none';
                        siteIcon.style.display = 'inline-block';
                        favicon.href = '/static/img/default-favicon.ico';
                        favicon.type = 'image/x-icon';
                    }
                    return serverRestarted;
                }
            } catch (e) {
                console.error('加载公开配置失败', e);
                if (window.location.protocol === 'https:') {
                    const httpUrl = 'http://' + window.location.host + window.location.pathname;
                    console.log('HTTPS连接失败，尝试跳转到HTTP:', httpUrl);
                    window.location.href = httpUrl;
                    return false;
                }
            }
            return false;
        }
        async function loadFiles(path) {
            isSearchMode = false;
            currentPath = path;
            const response = await api(`/api/files?path=${encodeURIComponent(path)}`);
            if (!response) return;
            const data = await response.json();
            updateBreadcrumb(path);
            allFiles = data.items || [];
            if (!isLoggedIn) {
                allFiles = allFiles.filter(item => !item.locked);
            }
            renderFiles(allFiles);
            updateSortIcons();
            document.getElementById('webdavUrl').textContent = `http://localhost:${data.port || 8081}/webdav/`;
        }
        function updateBreadcrumb(path) {
            const parts = path.split('/').filter(p => p);
            let html = '<a href="#" onclick="loadFiles(\'\');return false;">根目录</a>';
            let cumPath = '';
            for (const part of parts) {
                cumPath += '/' + part;
                html += ` > <a href="#" onclick="loadFiles('${cumPath}');return false;">${part}</a>`;
            }
            document.getElementById('breadcrumb').innerHTML = html;
        }
        function normalizePath(path) {
            return path.replace(/\\/g, '/').replace(/^\//, '');
        }
        function sortBy(field) {
            if (sortField === field) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortField = field;
                sortDirection = 'asc';
            }
            updateSortIcons();
            applySort();
        }
        function updateSortIcons() {
            document.querySelectorAll('.sort-icon').forEach(icon => {
                icon.classList.remove('active', 'asc', 'desc');
            });
            const activeIcon = document.getElementById('sort-' + sortField);
            if (activeIcon) {
                activeIcon.classList.add('active', sortDirection);
            }
        }
        function applySort() {
            const sortedItems = [...window.currentItems].sort((a, b) => {
                let aVal, bVal;
                if (sortField === 'name') {
                    aVal = a.name.toLowerCase();
                    bVal = b.name.toLowerCase();
                } else if (sortField === 'size') {
                    aVal = a.is_dir ? 0 : a.size;
                    bVal = b.is_dir ? 0 : b.size;
                } else if (sortField === 'modified') {
                    aVal = a.modified ? new Date(a.modified).getTime() : 0;
                    bVal = b.modified ? new Date(b.modified).getTime() : 0;
                }
                if (aVal < bVal) return sortDirection === 'asc' ? -1 : 1;
                if (aVal > bVal) return sortDirection === 'asc' ? 1 : -1;
                return 0;
            });
            renderFiles(sortedItems);
        }
        function renderFiles(items) {
            window.currentItems = items;
            const tableBody = document.getElementById('fileTableBody');
            if (items.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5" class="empty-state"></td></tr>';
                return;
            }
            tableBody.innerHTML = items.map(item => {
                const normalizedPath = normalizePath(item.path);
                const isSelected = selectedItems.has(item.path) ? 'selected' : '';
                const modifiedTime = item.modified ? new Date(item.modified).toLocaleString('zh-CN', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                }) : '';
                let displayName = '';
                if (isSearchMode) {
                    const dirPath = item.path.substring(0, item.path.length - item.name.length).replace(/\/$/, '');
                    displayName = dirPath ? `${dirPath}/` : '';
                }
                return `
                <tr class="${isSelected}" onclick="toggleSelect('${item.path}', event)">
                    <td><input type="checkbox" class="file-checkbox" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation();toggleSelect('${item.path}', event)"></td>
                    <td class="file-name-cell" onclick="event.stopPropagation();${item.is_dir ? `loadFiles('${normalizedPath}')` : ''}">
                        <span class="file-icon">${item.is_dir && item.locked ? `<i class="fas fa-folder"></i><i class="fas fa-lock file-lock-icon"></i>` : `<i class="fas ${item.is_dir ? 'fa-folder' : getFileIcon(item.name)}"></i>`}</span>
                        <span class="file-name"><span class="file-path">${displayName}</span>${item.name}</span>
                    </td>
                    <td class="file-size" style="text-align:right">${item.is_dir ? '-' : formatSize(item.size)}</td>
                    <td class="file-modified" style="text-align:right">${modifiedTime}</td>
                    <td>
                        <div class="file-actions">
                            ${!item.is_dir ? `<button class="file-action-btn" title="下载" onclick="event.stopPropagation();downloadFile('${normalizedPath}')"><i class="fas fa-download"></i></button>` : ''}
                            ${isLoggedIn && item.is_dir ? `<button class="file-action-btn" title="${item.locked ? '解锁' : '加锁'}" onclick="event.stopPropagation();toggleLock('${normalizedPath}', ${item.locked})"><i class="fas ${item.locked ? 'fa-unlock' : 'fa-lock'}"></i></button>` : ''}
                            ${isLoggedIn && !item.is_dir ? `<button class="file-action-btn" title="分享" onclick="event.stopPropagation();copyShareLink('${normalizedPath}')"><i class="fas fa-link"></i></button>` : ''}
                            ${isLoggedIn ? `
                                <button class="file-action-btn" title="重命名" onclick="event.stopPropagation();showRenameModal('${normalizedPath}', '${item.name}')"><i class="fas fa-edit"></i></button>
                                <button class="file-action-btn" title="删除" onclick="event.stopPropagation();deleteItem('${normalizedPath}')"><i class="fas fa-trash"></i></button>
                            ` : ''}
                        </div>
                    </td>
                </tr>`;
            }).join('');
        }
        function toggleSelectAll() {
            const checkbox = document.getElementById('selectAll');
            const checkboxes = document.querySelectorAll('.file-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = checkbox.checked;
            });
            window.currentItems.forEach(item => {
                if (checkbox.checked) {
                    selectedItems.add(item.path);
                } else {
                    selectedItems.delete(item.path);
                }
            });
            renderFiles(window.currentItems || []);
        }
        function handleSearchKey(event) {
            if (event.key === 'Enter') {
                handleSearch();
            }
        }
        function handleSearch() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            if (!keyword) {
                renderFiles(allFiles);
                updateSortIcons();
                updateBreadcrumb(currentPath);
                return;
            }
            isSearchMode = true;
            api(`/api/search?keyword=${encodeURIComponent(keyword)}`).then(response => {
                if (response && response.ok) {
                    return response.json();
                }
                return { items: [] };
            }).then(data => {
                const items = data.items || [];
                renderFiles(items);
                updateSortIcons();

        async function processEntry(entry, basePath, allFiles, dirPaths) {
            if (entry.isFile) {
                const file = await new Promise((resolve, reject) => {
                    entry.file(resolve, reject);
                });
                allFiles.push({ file, relativePath: basePath });
            } else if (entry.isDirectory) {
                const newBasePath = basePath ? basePath + '/' + entry.name : entry.name;
                dirPaths.add(newBasePath);
                const reader = entry.createReader();
                const entries = [];
                let batch = [];
                do {
                    batch = await new Promise((resolve) => {
                        reader.readEntries(resolve);
                    });
                    entries.push(...batch);
                } while (batch.length > 0);
                for (const subEntry of entries) {
                    await processEntry(subEntry, newBasePath, allFiles, dirPaths);
                }
            }
        }

        function updateUploadProgress(id, progress) {

        function completeUpload(id, success, isCancelled = false) {
            uploadCompleteCount++;

            document.getElementById(`status-${id}`).textContent = isCancelled ? '✗ 已取消' : (success ? '✓ 完成' : '✗ 失败');
            document.getElementById(`status-${id}`).style.color = isCancelled ? '#6b7280' : (success ? '#28a745' : '#dc3545');
            document.getElementById(`cancel-${id}`).style.display = 'none';
            if (success) {
                document.getElementById(`progress-${id}`).style.width = '100%';
                const item = uploadsInProgress[id];
                actionHistory.unshift({
                    action: '上传',
                    target: item.name,

                    time: new Date().toLocaleString('zh-CN')
                });
                if (actionHistory.length > 100) actionHistory.pop();
                localStorage.setItem('actionHistory', JSON.stringify(actionHistory));
            } else if (!isCancelled) {
                const item = uploadsInProgress[id];
                actionHistory.unshift({
                    action: '上传',
                    target: item.name,
                    status: 'fail',
                    time: new Date().toLocaleString('zh-CN')
                });
                if (actionHistory.length > 100) actionHistory.pop();
                localStorage.setItem('actionHistory', JSON.stringify(actionHistory));
            } else {
                const item = uploadsInProgress[id];
                actionHistory.unshift({
                    action: '上传',
                    target: item.name,
                    status: 'cancelled',
                    time: new Date().toLocaleString('zh-CN')
                });
                if (actionHistory.length > 100) actionHistory.pop();
                localStorage.setItem('actionHistory', JSON.stringify(actionHistory));
            }
            const waitingCount = Object.values(uploadsInProgress).filter(u => u.status === 'waiting').length;
            if (uploadCompleteCount >= totalUploads && waitingCount === 0) {
                setTimeout(() => {
                    const successCount = Object.values(uploadsInProgress).filter(u => u.status === 'completed').length;
                    const failCount = Object.values(uploadsInProgress).filter(u => u.status === 'failed').length;
                    const cancelledCount = Object.values(uploadsInProgress).filter(u => u.status === 'cancelled').length;
                    if (successCount > 0) {
                        showToast(`上传完成: ${successCount}个成功${failCount > 0 ? `, ${failCount}个失败` : ''}${cancelledCount > 0 ? `, ${cancelledCount}个已取消` : ''}`, 'success');
                    } else if (failCount > 0 && cancelledCount === 0) {
                        showToast(`上传失败: ${failCount}个文件`, 'error');
                    }
                    loadFiles(currentPath);
                    if (hideTimeout) {

        function cancelUpload(id) {

            completeUpload(id, false, true);

        async function uploadFile(file, uploadId, relativePath = '') {
            if (!isLoggedIn) {
                showToast('请先登录', 'error');
                completeUpload(uploadId, false);
                return;
            }
            if (!auth.username || !auth.password) {
                showToast('请先登录', 'error');
                completeUpload(uploadId, false);
                return;
            }
            const item = uploadsInProgress[uploadId];
            if (!item || item.status !== 'waiting') return;
            const id = uploadId;
            startUpload(id);
            const formData = new FormData();
            formData.append('file', file);
            let uploadPath = currentPath;
            if (relativePath) {
                const lastSlash = relativePath.lastIndexOf('/');
                uploadPath = lastSlash > 0 
                    ? (currentPath ? currentPath + '/' + relativePath.substring(0, lastSlash) : relativePath.substring(0, lastSlash))
                    : currentPath;
            }
            formData.append('path', uploadPath);
            
            const filePath = uploadPath ? uploadPath + '/' + file.name : '/' + file.name;
            uploadsInProgress[id].filePath = filePath;
            
            return new Promise((resolve) => {
                const xhr = new XMLHttpRequest();
                uploadsInProgress[id].xhr = xhr;
                
                xhr.open('POST', '/api/upload');
                xhr.setRequestHeader('Authorization', 'Basic ' + btoa(auth.username + ':' + auth.password));
                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const progress = Math.round((e.loaded / e.total) * 100);
                        updateUploadProgress(id, progress);
                    }
                });
                xhr.addEventListener('load', () => {
                    if (uploadsInProgress[id] && uploadsInProgress[id].status !== 'uploading') {
                        resolve();
                        return;
                    }
                    if (xhr.status === 200) {
                        completeUpload(id, true);
                    } else if (xhr.status === 401) {
                        logout();
                        showToast('请先登录', 'error');
                        completeUpload(id, false);
                    } else {
                        completeUpload(id, false);
                    }
                    resolve();
                });
                xhr.addEventListener('error', () => {
                    if (uploadsInProgress[id] && uploadsInProgress[id].status !== 'uploading') {
                        resolve();
                        return;
                    }
                    completeUpload(id, false);
                    resolve();
                });
                xhr.addEventListener('abort', () => {
                    resolve();
                });
                xhr.send(formData);
            });
        }

                        if (actionHistory.length > 100) actionHistory.pop();
                        localStorage.setItem('actionHistory', JSON.stringify(actionHistory));
                        showToast('目录已加锁', 'success');
                        loadFiles(currentPath);
                    }
                });
            }
        }
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        function showHistory() {
            const content = document.getElementById('historyContent');
            if (actionHistory.length === 0) {
                content.innerHTML = `
                    <div class="history-empty">
                        <i class="fas fa-history"></i>

        function clearHistory() {

        async function showShares() {
            if (isLoggedIn) {
                await syncSharesFromBackend();
            }
            const content = document.getElementById('shareContent');
            if (shareLinks.length === 0) {
                content.innerHTML = `

                ` + shareLinks.map((item, index) => `

                            <span class="share-item-time">${item.createdAt}</span>

        function toggleSelectAllShares() {
            const selectAll = document.getElementById('selectAllShares');
            const checkboxes = document.querySelectorAll('.share-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = selectAll.checked;
            });
        }
        async function deleteSelectedShares() {
            const checkboxes = document.querySelectorAll('.share-checkbox:checked');
            if (checkboxes.length === 0) {
                showToast('请选择要删除的分享链接', 'error');
                return;
            }
            const indicesToDelete = Array.from(checkboxes).map(cb => parseInt(cb.dataset.index)).sort((a, b) => b - a);
            const tokensToDelete = indicesToDelete.map(index => shareLinks[index].token);
            const deletedCount = indicesToDelete.length;
            for (const index of indicesToDelete) {
                shareLinks.splice(index, 1);
            }
            localStorage.setItem('shareLinks', JSON.stringify(shareLinks));
            const response = await api('/api/shares', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tokens: tokensToDelete })
            });
            if (response && response.ok) {
                actionHistory.unshift({
                    action: '删除分享',
                    target: deletedCount + '个分享链接',
                    status: 'success',
                    time: new Date().toLocaleString('zh-CN')
                });
                if (actionHistory.length > 100) actionHistory.pop();
                localStorage.setItem('actionHistory', JSON.stringify(actionHistory));
                await syncSharesFromBackend();
                showShares();
                showToast('已删除 ' + deletedCount + ' 个分享链接', 'success');
            } else {
                showToast('删除失败', 'error');
            }
        }
        let originalHttpsEnabled = false;
        let settingsListenersInitialized = false;

                const data = await response.json();

                document.getElementById('settingCopyrightDomain').value = data.copyright_domain || '';
                document.getElementById('settingPort').value = data.port;
                document.getElementById('settingHttpsPort').value = data.https_port || '';
                document.getElementById('settingWebdavHttpsPort').value = data.webdav_https_port;

                document.getElementById('settingSslKey').value = data.ssl_key;

                document.getElementById('settingSambaPort').value = data.samba_port || '';
                document.getElementById('settingFtpPort').value = data.ftp_port || '';
                document.getElementById('settingFtpPassiveMin').value = data.ftp_passive_min || '';

                document.getElementById('settingEnableWebdavHttps').checked = webdavHttpsEnabled;

                    document.getElementById('settingEnableWebdavHttps').addEventListener('change', toggleWebdavHttpsPortInput);
                    document.getElementById('settingEnableSamba').addEventListener('change', toggleSambaPortInput);

        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.querySelector(`button[onclick="switchTab('${tabId}')"]`).classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }
        function validatePort(port, portName) {
            const portNum = parseInt(port);
            if (isNaN(portNum)) {
                return { valid: false, message: `${portName}必须是数字` };
            }
            if (portNum < 1 || portNum > 65535) {
                return { valid: false, message: `${portName}必须在1-65535之间` };
            }
            return { valid: true, message: '' };
        }

        async function checkPortAvailable(port, portName) {
            const response = await fetch(`/api/check-port?port=${port}`);
            if (response.ok) {
                const result = await response.json();
                if (!result.available) {
                    return { available: false, message: result.message || `${portName}已被占用` };
                }
                return { available: true, message: '' };
            }
            return { available: true, message: '' };
        }

        async function saveSettings() {
            const httpPortValue = document.getElementById('settingPort').value;
            const httpsEnabledCheckbox = document.getElementById('settingEnableHttps');
            const httpsEnabled = httpsEnabledCheckbox.checked;
            const httpsPortValue = document.getElementById('settingHttpsPort').value;
            const sslCrtValue = document.getElementById('settingSslCrt').value;
            const sslKeyValue = document.getElementById('settingSslKey').value;
            const webdavEnabled = document.getElementById('settingEnableWebdav').checked;
            const webdavPortValue = document.getElementById('settingWebdavPort').value;
            const webdavHttpsEnabled = document.getElementById('settingEnableWebdavHttps').checked;
            const webdavHttpsPortValue = document.getElementById('settingWebdavHttpsPort').value;
            
            const httpPortValid = validatePort(httpPortValue, 'HTTP端口');
            if (!httpPortValid.valid) {
                showToast(httpPortValid.message, 'error');
                return;
            }
            
            const httpPortAvailable = await checkPortAvailable(httpPortValue, 'HTTP端口');
            if (!httpPortAvailable.available) {
                showToast(httpPortAvailable.message, 'error');
                return;
            }
            
            if (httpsEnabled) {
                const httpsPortValid = validatePort(httpsPortValue, 'HTTPS端口');
                if (!httpsPortValid.valid) {
                    showToast(httpsPortValid.message, 'error');
                    return;
                }
                
                const httpsPortAvailable = await checkPortAvailable(httpsPortValue, 'HTTPS端口');
                if (!httpsPortAvailable.available) {
                    showToast(httpsPortAvailable.message, 'error');
                    return;
                }
                
                if (!sslCrtValue) {
                    showToast('启用HTTPS需要填写SSL证书路径', 'error');
                    return;
                }
                if (!sslKeyValue) {
                    showToast('启用HTTPS需要填写SSL密钥路径', 'error');
                    return;
                }
            }
            
            if (webdavEnabled) {
                const webdavPortValid = validatePort(webdavPortValue, 'WebDAV端口');
                if (!webdavPortValid.valid) {
                    showToast(webdavPortValid.message, 'error');
                    return;
                }
                
                const webdavPortAvailable = await checkPortAvailable(webdavPortValue, 'WebDAV端口');
                if (!webdavPortAvailable.available) {
                    showToast(webdavPortAvailable.message, 'error');
                    return;
                }
            }
            
            if (webdavHttpsEnabled) {
                const webdavHttpsPortValid = validatePort(webdavHttpsPortValue, 'WebDAV HTTPS端口');
                if (!webdavHttpsPortValid.valid) {
                    showToast(webdavHttpsPortValid.message, 'error');
                    return;
                }
                
                const webdavHttpsPortAvailable = await checkPortAvailable(webdavHttpsPortValue, 'WebDAV HTTPS端口');
                if (!webdavHttpsPortAvailable.available) {
                    showToast(webdavHttpsPortAvailable.message, 'error');
                    return;
                }
                
                if (!sslCrtValue || !sslKeyValue) {
                    showToast('启用HTTPS WebDAV需要SSL证书', 'error');
                    return;
                }
            }
            
            const sambaEnabled = document.getElementById('settingEnableSamba').checked;
            const sambaPortValue = document.getElementById('settingSambaPort').value;
            if (sambaEnabled) {
                if (!sambaPortValue) {
                    showToast('启用Samba需要填写Samba端口', 'error');
                    return;
                }
                
                const sambaPortValid = validatePort(sambaPortValue, 'Samba端口');
                if (!sambaPortValid.valid) {
                    showToast(sambaPortValid.message, 'error');
                    return;
                }
                
                const sambaPortAvailable = await checkPortAvailable(sambaPortValue, 'Samba端口');
                if (!sambaPortAvailable.available) {
                    showToast(sambaPortAvailable.message, 'error');
                    return;
                }
            }
            
            const ftpEnabled = document.getElementById('settingEnableFtp').checked;
            const ftpPortValue = document.getElementById('settingFtpPort').value;
            const ftpPassiveMinValue = document.getElementById('settingFtpPassiveMin').value;
            const ftpPassiveMaxValue = document.getElementById('settingFtpPassiveMax').value;
            if (ftpEnabled) {
                if (!ftpPortValue) {
                    showToast('启用FTP需要填写FTP端口', 'error');
                    return;
                }
                
                const ftpPortValid = validatePort(ftpPortValue, 'FTP端口');
                if (!ftpPortValid.valid) {
                    showToast(ftpPortValid.message, 'error');
                    return;
                }
                
                const ftpPortAvailable = await checkPortAvailable(ftpPortValue, 'FTP端口');
                if (!ftpPortAvailable.available) {
                    showToast(ftpPortAvailable.message, 'error');
                    return;
                }
                
                if (!ftpPassiveMinValue) {
                    showToast('启用FTP需要填写被动端口最小值', 'error');
                    return;
                }
                
                const ftpPassiveMinValid = validatePort(ftpPassiveMinValue, 'FTP被动端口最小值');
                if (!ftpPassiveMinValid.valid) {
                    showToast(ftpPassiveMinValid.message, 'error');
                    return;
                }
                
                if (!ftpPassiveMaxValue) {
                    showToast('启用FTP需要填写被动端口最大值', 'error');
                    return;
                }
                
                const ftpPassiveMaxValid = validatePort(ftpPassiveMaxValue, 'FTP被动端口最大值');
                if (!ftpPassiveMaxValid.valid) {
                    showToast(ftpPassiveMaxValid.message, 'error');
                    return;
                }
                
                if (parseInt(ftpPassiveMinValue) > parseInt(ftpPassiveMaxValue)) {
                    showToast('FTP被动端口最小值不能大于最大值', 'error');
                    return;
                }
            }
            
            const data = {
                network_name: document.getElementById('settingNetworkName').value,
                network_logo: document.getElementById('settingNetworkLogo').value,
                copyright_year: document.getElementById('settingCopyrightYear').value,
                copyright_domain: document.getElementById('settingCopyrightDomain').value,
                port: parseInt(document.getElementById('settingPort').value),
                https_port: httpsPortValue ? parseInt(httpsPortValue) : null,
                ssl_crt: sslCrtValue,
                ssl_key: sslKeyValue,
                https_enabled: httpsEnabled,
                webdav_enabled: document.getElementById('settingEnableWebdav').checked,
                webdav_port: parseInt(document.getElementById('settingWebdavPort').value),
                webdav_https_enabled: document.getElementById('settingEnableWebdavHttps').checked,
                webdav_https_port: document.getElementById('settingWebdavHttpsPort').value ? parseInt(document.getElementById('settingWebdavHttpsPort').value) : null,
                samba_enabled: document.getElementById('settingEnableSamba').checked,
                samba_port: parseInt(document.getElementById('settingSambaPort').value),
                ftp_enabled: document.getElementById('settingEnableFtp').checked,
                ftp_port: parseInt(document.getElementById('settingFtpPort').value),
                ftp_passive_min: parseInt(document.getElementById('settingFtpPassiveMin').value),
                ftp_passive_max: parseInt(document.getElementById('settingFtpPassiveMax').value)
            };
            const username = document.getElementById('settingUsername').value;
            if (username) data.username = username;
            const password = document.getElementById('settingPassword').value;
            if (password) data.password = password;
            const response = await api('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (response && response.ok) {
                const result = await response.json();
                auth.username = data.username;
                if (password) auth.password = password;
                closeModal('settingsModal');
                if (result.needs_restart) {
                    showToast('设置已保存，应用正在重启...', 'success');
                    try {
                        await api('/api/restart', { method: 'POST' });
                    } catch (e) {
                        console.log('Restart API called');
                    }
                    const targetHttps = result.https_will_be_enabled && result.https_port;
                    const targetHttpPort = data.port;
                    const targetHttpsPort = result.https_port;
                    const redirectUrl = targetHttps 
                        ? `https://${window.location.hostname}:${targetHttpsPort}${window.location.pathname}`
                        : `http://${window.location.hostname}:${targetHttpPort}${window.location.pathname}`;
                    
                    if (targetHttps) {
                        setTimeout(() => {
                            const controller = new AbortController();
                            const timeoutId = setTimeout(() => controller.abort(), 3000);
                            fetch(`https://${window.location.hostname}:${targetHttpsPort}/api/status`, {
                                method: 'GET',
                                signal: controller.signal,
                                mode: 'no-cors'
                            }).then(() => {
                                clearTimeout(timeoutId);
                                window.location.href = redirectUrl;
                            }).catch(() => {
                                clearTimeout(timeoutId);
                                window.location.href = `http://${window.location.hostname}:${targetHttpPort}${window.location.pathname}`;
                            });
                        }, 4000);
                    } else {
                        setTimeout(() => {
                            window.location.href = redirectUrl;
                        }, 4000);
                    }
                } else {
                    showToast('设置已保存', 'success');
                    location.reload();
                }
            } else if (response) {
                const error = await response.json();
                let errorMessage = '保存失败';
                if (error.message) {
                    errorMessage = error.message;
                } else if (error.error === 'https_config_incomplete') {
                    errorMessage = '启用HTTPS，需HTTPS端口、SSL证书、SSL密钥同时配置';
                } else if (error.error === 'ssl_crt_not_exists') {
                    errorMessage = 'SSL证书文件不存在，请检查';
                } else if (error.error === 'ssl_key_not_exists') {
                    errorMessage = 'SSL密钥文件不存在，请检查';
                } else if (error.error === 'network_logo_not_exists') {
                    errorMessage = '站点Logo文件不存在，请检查';
                } else if (error.error === 'port_in_use') {
                    errorMessage = 'HTTP端口被占用';
                } else if (error.error === 'https_port_in_use') {
                    errorMessage = 'HTTPS端口被占用';
                } else if (error.error === 'webdav_port_in_use') {
                    errorMessage = 'HTTP WebDAV端口被占用';
                } else if (error.error === 'webdav_https_port_in_use') {
                    errorMessage = 'HTTPS WebDAV端口被占用';
                } else if (error.error === 'webdav_https_port_required') {
                    errorMessage = '启用HTTPS WebDAV需填写HTTPS WebDAV端口';
                } else if (error.error === 'ssl_crt_required') {
                    errorMessage = '启用HTTPS WebDAV需填写SSL证书路径';
                } else if (error.error === 'ssl_key_required') {
                    errorMessage = '启用HTTPS WebDAV需填写SSL密钥路径';
                } else if (error.error === 'samba_port_required') {
                    errorMessage = '启用Samba需要填写Samba端口';
                } else if (error.error === 'samba_port_in_use') {
                    errorMessage = 'Samba端口被占用';
                } else if (error.error === 'ftp_port_required') {
                    errorMessage = '启用FTP需要填写FTP端口';
                } else if (error.error === 'ftp_passive_min_required') {
                    errorMessage = '启用FTP需要填写被动端口最小值';
                } else if (error.error === 'ftp_passive_max_required') {
                    errorMessage = '启用FTP需要填写被动端口最大值';
                } else if (error.error === 'ftp_port_in_use') {
                    errorMessage = 'FTP端口被占用';
                }
                showToast(errorMessage, 'error');
            }
        }
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }
        function setupModalClickOutside() {
            document.querySelectorAll('.modal, .login-screen').forEach(modal => {
                modal.addEventListener('click', function(e) {
                    if (e.target === modal) {
                        if (modal.classList.contains('modal')) {
                            modal.classList.remove('active');
                        } else if (modal.classList.contains('login-screen')) {
                            closeLoginScreen();
                        }
                    }
                });
            });
        }
        setupModalClickOutside();
        function showToast(message, type = '', duration = 3000) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => { toast.className = 'toast'; }, duration);
        }
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
                document.getElementById('loginScreen').style.display = 'none';
            }
        });

        let scrollHideTimer = null;
        const scrollContainer = document.querySelector('.file-table-wrapper');
        let isInFileList = false;

        function showScrollbar() {
            if (scrollContainer) {
                scrollContainer.classList.add('custom-scrollbar');
                clearTimeout(scrollHideTimer);
                scrollHideTimer = setTimeout(() => {
                    scrollContainer.classList.remove('custom-scrollbar');
                }, 3000);
            }
        }

        if (scrollContainer) {
            scrollContainer.addEventListener('scroll', showScrollbar);
            
            scrollContainer.addEventListener('mouseenter', () => {
                isInFileList = true;
            });
            
            scrollContainer.addEventListener('mouseleave', () => {
                isInFileList = false;
            });
        }

        document.addEventListener('keydown', (e) => {
            if ((e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') && isInFileList) {
                showScrollbar();
            }
        });
    </script>
